# Spike S3 local testbed. Project name cfo-s3; nothing here touches any other
# Docker project. Ports are published on 127.0.0.1 only.
#
#   S3_MINIO_KEY=... S3_MINIO_SECRET=... docker compose -p cfo-s3 -f spikes/s3/compose.yaml up -d --build
#
# The bench scripts (spikes/s3/bench/) generate the two MinIO values at run time.
name: cfo-s3

# Omnigent built from the fork's cfo/integration at af3e49de2 (bench/prepare_staging.py), the
# same base as the spike image. The results before 22 Oct used the published image
# ghcr.io/omnigent-ai/omnigent-server@sha256:dba491573ba16b42da7447a7ab6e978bfeb6f49876093cc925f8340abd010df6.
x-omnigent-image: &omnigent_image cfo-s3/omnigent-server:af3e49de2

services:
  server:
    image: *omnigent_image
    entrypoint: ["omnigent", "server", "--host", "0.0.0.0", "--port", "8000", "--no-open",
                 "--database-uri", "sqlite:////data/chat.db", "--artifact-location", "/data/artifacts"]
    environment:
      HOME: /data/home
      OMNIGENT_DATA_DIR: /data/home/.omnigent
      OMNIGENT_AUTH_PROVIDER: header
      OMNIGENT_LOCAL_SINGLE_USER: "1"
      OMNIGENT_DISABLE_CATALOG_LOOKUP: "1"
      OMNIGENT_DISABLE_TELEMETRY: "1"
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:18000:8000"

  mockllm:
    # Omnigent's own e2e mock LLM (OpenAI Responses + Anthropic Messages, with
    # request capture), the copy prepare_staging.py takes from the fork.
    image: *omnigent_image
    entrypoint: ["python", "-m", "uvicorn", "--app-dir", "/mock", "mock_llm_server:app",
                 "--host", "0.0.0.0", "--port", "9999", "--log-level", "warning"]
    volumes:
      - ./image/mockllm/mock_llm_server.py:/mock/mock_llm_server.py:ro
    ports:
      - "127.0.0.1:19999:9999"

  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_MINIO_KEY:?generated by the bench scripts}
      MINIO_ROOT_PASSWORD: ${S3_MINIO_SECRET:?generated by the bench scripts}
    tmpfs:
      - /data:size=8g

  computer:
    build: ./image
    image: cfo-s3-computer:spike
    # standard-2: 1 vCPU, 6 GiB.
    cpus: 1.0
    mem_limit: 6g
    environment: &computer_env
      OMNIGENT_SERVER_URL: http://server:8000
      OMNIGENT_HOST_ID: 6d2f6c1e-3b1a-4c55-9a51-5f3e0a000001
      OMNIGENT_HOST_NAME: s3-computer-1
      OMNIGENT_DISABLE_TELEMETRY: "1"
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_MINIO_KEY}
      S3_SECRET_KEY: ${S3_MINIO_SECRET}
      S3_BUCKET: checkpoints
      S3_COMPUTER_ID: computer-1
      S3_FREEZER: ${S3_FREEZER:-sigstop}
      S3_RUNNER_IDLE_TIMEOUT_S: ${S3_RUNNER_IDLE_TIMEOUT_S:-900}
    volumes:
      - /home/decay/Lervent/omnigent:/seed/omnigent:ro
    tmpfs:
      # A deliberately small snapshot area for the full-disk test.
      - /snap-small:size=48m,mode=1777
    ports:
      - "127.0.0.1:17070:7070"
    depends_on: [server, mockllm, minio]

  # A fresh computer for the restore test: same image, empty home, restores
  # the published checkpoint before anything else starts.
  computer2:
    image: cfo-s3-computer:spike
    profiles: ["restore"]
    cpus: 1.0
    mem_limit: 6g
    environment:
      <<: *computer_env
      S3_RESTORE_ON_START: "1"
      S3_START_HOST: "0"
    ports:
      - "127.0.0.1:17071:7070"
