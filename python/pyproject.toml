[project]
name = "cloudflare-omnigent"
version = "0.0.0"
description = "Omnigent on Cloudflare: Python side of the platform (the Cloudflare launcher and contract tests now; supervisor and gateway backend later)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.140",
  "jsonschema>=4.25",
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cloudflare_omnigent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is imported from this directory: the uv project is not installed (package = false).
pythonpath = ["."]
