# The setup terminal's tmux (WP3.28): it only keeps the shell alive while the browser's stream is
# away (a dropped connection, a Durable Object reset), and is otherwise invisible. The person using
# the terminal is not expected to know tmux, so it has no keys of its own (no prefix: nothing to
# get stuck in), no status line and no mouse mode, and it passes the Escape key on at once.
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T root
set -g status off
set -g mouse off
set -g set-titles off
set -g allow-rename off
set -g visual-bell off
set -g history-limit 5000
set -s escape-time 0
set -g default-terminal "tmux-256color"
# No alternate screen in the browser's terminal: what scrolls off the top stays in its own
# scrollback (the page's xterm.js keeps 5,000 lines), since tmux's copy mode has no key here.
set -ga terminal-overrides ",*:smcup@:rmcup@"
# A shell that exits ends its session, and the stream with it (the page says the session ended).
set -g remain-on-exit off
set -g destroy-unattached off
set -s exit-empty on
