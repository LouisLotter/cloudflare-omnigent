# Tool settings for the computer image's Python code (cfo_computer, its fakes and tools),
# matching python/pyproject.toml. Nothing is installed from here: the Dockerfile copies the
# package into the image's system Python.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cfo_computer"]
