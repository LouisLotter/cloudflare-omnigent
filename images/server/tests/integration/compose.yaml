# Image tests for images/server: an S3 stand-in for R2 behind Toxiproxy, so the tests can
# refuse or blackhole the "R2" link. Server containers are started by the tests themselves
# (`docker run`, named cfo-wp23-server-*), on this project's network. Local only; credentials
# are generated per run and never written to the repository.
name: cfo-wp23

services:
  minio:
    # Community build of MinIO (upstream no longer publishes images), as in spike S4.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${CFO_IT_S3_USER:?set by the test run}
      MINIO_ROOT_PASSWORD: ${CFO_IT_S3_PASSWORD:?set by the test run}
    ports:
      - "127.0.0.1::9000"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports:
      - "127.0.0.1::8474"
