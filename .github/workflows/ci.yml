# Continuous integration for cloudflare-omnigent.
#
# Runs on every pull request and on every push to main, and never deploys: deployments run from
# the owner's laptop only (implementation plan, "Environment decisions"). Nothing here references
# a secret, the token can only read the repository, and the trigger is `pull_request`, never
# `pull_request_target`, so code from a fork runs without any privileges. Every action is pinned
# to a full commit SHA; the comment names the release that SHA belongs to.
#
# Jobs:
#   node    Biome lint; typecheck, including `wrangler types --check`; the Vitest suites
#           (contracts, worker unit tests in Node, worker tests inside workerd); contract drift,
#           so the committed JSON Schemas must match the zod source; coverage thresholds, set in
#           the vitest configs (90% per pure module); and `wrangler deploy --dry-run`, which
#           bundles the Worker without a Cloudflare account.
#   python  The uv project in python/: locked install, ruff lint and format check, and pytest,
#           which validates the golden fixtures against the exported JSON Schemas.
#   canary  The canary-secret scanner (scripts/canary-scan.ts). Its self-test proves it still
#           finds planted canaries in text, NUL-prefixed, binary, gzip and tar.gz files, and that
#           a zip or an empty directory counts as incomplete; then it scans the contracts, Worker
#           source, Python tests and docs. Any non-zero exit fails the step: 1 means a canary was
#           found, 2 a usage error, and 3 an incomplete scan (undecodable data, an unreadable
#           file, or a path with no files), which is never treated as clean.
#   images  Build the existing server and test targets; run credential-free image tests.
#
# Still to come, as the work packages that need them land: deterministic simulation tests (M3)
# and Stryker mutation thresholds (75%) for the state machines and the schedule cache.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that pull request's older run. Pushes to main are
  # grouped by commit, so every commit on main keeps its own complete result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # No usage metrics from CI.
  WRANGLER_SEND_METRICS: "false"

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node (lint, typecheck, tests, contract drift, coverage, dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Contract drift
        run: |
          pnpm contracts:export
          if ! git diff --exit-code -- contracts/schema; then
            echo "::error::contracts/schema is out of date. Run 'pnpm contracts:export' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- contracts/schema)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::New files in contracts/schema are not committed. Run 'pnpm contracts:export' and commit the result."
            exit 1
          fi

      - name: Coverage thresholds
        run: pnpm coverage

      - name: Platform Worker dry run
        run: pnpm --filter @cfo/worker exec wrangler deploy --config wrangler.jsonc --dry-run --outdir dist/platform

      - name: Web Worker dry run
        run: pnpm --filter @cfo/worker exec wrangler deploy --config wrangler.web.jsonc --dry-run --outdir dist/web

      # Both built Worker bundles are scanned too, not only the sources. An explicit path is
      # scanned even though it is named dist, and an empty bundle directory exits 3, not 0.
      - name: Canary scan of both built Worker bundles
        run: node scripts/canary-scan.ts worker/dist/platform worker/dist/web

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          cache-dependency-glob: python/uv.lock

      - name: Install the locked environment
        run: uv sync --locked --directory python

      - name: Ruff lint
        run: uv run --locked --directory python ruff check

      - name: Ruff format
        run: uv run --locked --directory python ruff format --check

      - name: Pytest
        run: uv run --locked --directory python pytest

  canary:
    name: Canary-secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The scanner runs on Node's built-in TypeScript support. Dependencies are deliberately not
      # installed, so the scan sees exactly the checked-out tree and no node_modules.
      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # With no paths, --self-test runs alone: it plants canaries in a temporary directory and
      # exits 0 only if every planted case is detected and every incomplete case is reported.
      - name: Scanner self-test (finds planted canaries, rejects incomplete scans)
        run: node scripts/canary-scan.ts --self-test

      # Each path must hold at least one file; binary files are scanned, not skipped.
      - name: Scan contracts, Worker source, Python tests and docs
        run: node scripts/canary-scan.ts contracts worker/src python/tests docs

  images:
    name: Server image (build, prerequisites, unit and in-process tests)
    runs-on: ubuntu-24.04
    # Initial cold-build budget; local cached timing does not qualify a hosted cold runner.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Existing Docker targets and pinned dependencies only. No registry login or push.
      - name: Build the server target
        run: docker build --platform linux/amd64 -f images/server/Dockerfile --target server -t cfo-server:ci-runtime .

      - name: Build the image's test target
        run: docker build --platform linux/amd64 -f images/server/Dockerfile --target test -t cfo-server:ci-test .

      # The suite skips app/Litestream cases when prerequisites are absent. Refuse that here.
      - name: Require the pinned app, entrypoint and Litestream
        run: >-
          docker run --rm --network none cfo-server:ci-test python -c
          'import pathlib, subprocess; import omnigent.server.app;
          assert pathlib.Path("/app/entrypoint.py").is_file();
          assert subprocess.check_output(["litestream", "version"], text=True).strip() == "0.5.17"'

      # Uses the Dockerfile's existing CMD: tests excluding tests/integration. Loopback and
      # local file replicas work with --network none; no provider or Cloudflare account used.
      - name: Run the image's unit and in-process suite
        run: docker run --rm --network none -e OMNIGENT_DISABLE_CATALOG_LOOKUP=1 cfo-server:ci-test
